<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osaid Core</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 100%; max-width: 620px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 85vh; overflow: hidden; }
        .header { background: #1a73e8; color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; font-size: 1.2rem; font-weight: bold; }
        .chat-history { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 82%; padding: 12px 16px; border-radius: 8px; line-height: 1.5; word-wrap: break-word; font-size: 0.95rem; }
        .user-message { background: #e0f2fe; color: #0369a1; align-self: flex-end; border-bottom-right-radius: 0; }
        .agent-message { background: #f1f5f9; color: #334155; align-self: flex-start; border-bottom-left-radius: 0; white-space: pre-wrap; }
        .input-area { display: flex; padding: 15px; border-top: 1px solid #e2e8f0; background: white; }
        input[type="text"] { flex-grow: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 1rem; }
        .send-btn { background: #1a73e8; color: white; border: none; padding: 0 20px; margin-left: 10px; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: bold; }
        .send-btn:hover { background: #1557b0; }
        .thinking { font-style: italic; color: #94a3b8; font-size: 0.9rem; align-self: flex-start; display: none; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">
            <span>🤖 Osaid Core</span>
            <span style="font-size: 0.85rem; font-weight: normal; opacity: 0.9;">Online</span>
        </div>

        <div class="chat-history" id="chatHistory">
            <div class="message agent-message">hello osaid buddy how can i help you</div>
            <div class="thinking" id="thinkingIndicator">Agent is thinking...</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask anything..." autocomplete="off">
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const inputField = document.getElementById('userInput');
        const history = document.getElementById('chatHistory');
        const indicator = document.getElementById('thinkingIndicator');

        inputField.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });

        async function sendMessage() {
            const text = inputField.value.trim();
            if (!text) return;

            appendMessage(text, 'user-message');
            inputField.value = '';
            
            indicator.style.display = 'block';
            history.appendChild(indicator); 
            history.scrollTop = history.scrollHeight;

            try {
                const response = await fetch('/api/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                
                const data = await response.json();
                indicator.style.display = 'none';
                appendMessage(data.reply || "Error: No reply.", 'agent-message');
            } catch (error) {
                indicator.style.display = 'none';
                appendMessage("Network error connecting to the agent backend.", 'agent-message');
            }
        }

        function appendMessage(text, className) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.textContent = text;
            history.insertBefore(div, indicator);
            history.scrollTop = history.scrollHeight;
        }
    </script>
</body>
</html>
